<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>humanim · teleprompter</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; cursor: none;
    font-family: Lato, "Helvetica Neue", Arial, sans-serif; }
  #texto { position: absolute; top: 1.5vh; left: 7vw; right: 7vw; text-align: center; }
  #atual { font-size: clamp(36px, 4.6vw, 88px); font-weight: 700; line-height: 1.18; transition: color .15s; }
  #proxima { margin-top: 1.1em; font-size: clamp(22px, 2.3vw, 44px); line-height: 1.25; color: #5e5e5e; }
  .espera #atual { color: #8a8a8a; }
  .regravou #atual { color: #ffd60a; }
  #aviso { position: absolute; left: 8vw; right: 8vw; top: 55%; transform: translateY(-50%);
    text-align: center; font-size: clamp(26px, 2.8vw, 52px); color: #ddd; }
  #aviso.contagem { font-size: 24vh; font-weight: 700; color: #fff; }
  #aviso.erro { color: #ff6b6b; font-size: clamp(22px, 2vw, 34px); }
  #camera { position: absolute; right: 24px; bottom: 24px; width: 260px; border-radius: 8px; overflow: hidden; }
  #previa { display: block; width: 100%; transform: scaleX(-1); opacity: .8; background: #111; }
  /* O retângulo amarelo é o que o [CARA] usa (largura e fundo em quadro(), com os números do formato.py). */
  #quadro { position: absolute; top: 0; bottom: 0; box-sizing: border-box;
    border: 2px solid #ffd60a; box-shadow: 0 0 0 400px rgba(0, 0, 0, .55); }
  #mic { height: 6px; background: #222; }
  #nivel { height: 100%; width: 0; background: #34c759; }
  #mudo { display: none; position: absolute; right: 24px; bottom: 190px; width: 260px; font-size: 16px;
    color: #ff6b6b; text-align: right; }
  #rodape { position: absolute; left: 24px; bottom: 24px; font-size: 18px; color: #6e6e6e; }
  #ponto, #denovo { display: none; margin-left: 18px; }
  #ponto { color: #ff3b30; }
  #denovo { color: #ffd60a; }
  .gravando #ponto, .regravou #denovo { display: inline; }
  .fim #texto { display: none; }
</style>
</head>
<body>
<div id="texto"><div id="atual"></div><div id="proxima"></div></div>
<div id="aviso">Ligando a câmera…</div>
<div id="camera"><video id="previa" autoplay muted playsinline></video><div id="quadro"></div><div id="mic"><div id="nivel"></div></div></div>
<div id="mudo">Microfone sem som: tire o mudo nas configurações de som.</div>
<div id="rodape"><span id="linha"></span><span id="ponto">● gravando</span><span id="denovo">↺ de novo</span></div>
<script>
const $ = id => document.getElementById(id);
const TIPOS = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
const FORMATO = __FORMATO__;  // do formato.py: a faixa de cima que o app cobre (fração da altura) e o zoom do [CARA]
// preparando → pronto → contando → gravando → salvando → fim (ou cancelado, erro)
let estado = 'preparando', falas = [], atual = 0, de = [], ate = [], regravadas = new Set();
let stream, rec, t0 = 0, fila = Promise.resolve(), falhou = null, motivoParada = '';

const agora = () => (performance.now() - t0) / 1000;

// O [CARA] usa a faixa 9:16 do meio do quadro; no plano com zoom ela fica FORMATO.zoom vez mais estreita e
// mais baixa. O retângulo é a largura que aparece nos dois planos; a faixa escura de cima fica embaixo da
// interface do app (o zoom não mexe nela) e a amarelada de baixo só aparece no plano sem zoom.
function quadro(aspecto = 16 / 9) {
  const z = FORMATO.zoom, cima = FORMATO.faixa * 100;
  const w = Math.min(1, 9 / 16 / aspecto) * 100 / z, baixo = ((1 - 1 / z) * FORMATO.faixa + 1 / z) * 100;
  Object.assign($('quadro').style, {width: `${w}%`, left: `${(100 - w) / 2}%`,
    background: `linear-gradient(rgba(0, 0, 0, .6) ${cima}%, transparent ${cima}%), ` +
                `linear-gradient(transparent ${baixo}%, rgba(255, 214, 10, .22) ${baixo}%)`});
}
quadro();

const lista = () => falas.slice(0, atual + 1).map((f, i) => ({linha: f.linha, de: de[i], ate: ate[i]}));
// Cada Espaço e R vai na hora para o humanim: se esta janela travar ou cair, ele guarda a tomada com os tempos.
function marcar() {
  fetch('/marca', {method: 'POST', body: JSON.stringify({tempos: lista(), regravadas: [...regravadas]})}).catch(() => {});
}
// Sinal de vida: sem ele por 2 min (sem gravar) ou sem pedaço da gravação por 10 s, o humanim encerra com ERRO.
setInterval(() => {
  if (!['fim', 'erro', 'cancelado'].includes(estado)) fetch('/vivo', {method: 'POST'}).catch(() => {});
}, 5000);

function aviso(texto, classe = '') { $('aviso').textContent = texto; $('aviso').className = classe; }

function mostrar() {
  $('atual').textContent = falas[atual].fala;
  $('proxima').textContent = atual + 1 < falas.length ? falas[atual + 1].fala : '(última: Espaço encerra e salva)';
  $('linha').textContent = `linha ${atual + 1}/${falas.length}`;
}

async function postar(url, corpo) {
  const r = await fetch(url, {method: 'POST', body: corpo});
  if (!r.ok) throw new Error(await r.text());
}

function desligar() { if (stream) stream.getTracks().forEach(t => t.stop()); }

function fim(texto, classe = '') { estado = 'fim'; document.body.className = 'fim'; aviso(texto, classe); desligar(); }

function erro(texto, avisar = true) {
  fim(texto, 'erro');
  estado = 'erro';
  if (avisar) postar('/erro', texto).catch(() => {});
}

function mensagemCamera(e) {
  const m = {
    NotAllowedError: 'o navegador não deixou usar a câmera e o microfone. Para ele perguntar de novo, apague ~/.cache/humanim/chrome (ou libere nas informações do site).',
    NotFoundError: 'não achei câmera ou microfone ligados.',
    NotReadableError: 'a câmera ou o microfone está em uso por outro programa. Feche o outro programa.',
  }[e.name];
  return 'Câmera: ' + (m || `${e.name}: ${e.message}`);
}

async function preparar() {
  try {
    falas = await (await fetch('/falas')).json();
  } catch (e) { return erro('Não consegui ler o roteiro do humanim: ' + e.message, false); }
  mostrar();
  document.body.className = 'espera';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 30}},
      audio: {echoCancellation: false, autoGainControl: false, noiseSuppression: true},
    });
  } catch (e) { return erro(mensagemCamera(e)); }
  if (estado !== 'preparando') return desligar();  // Esc enquanto ligava
  $('previa').srcObject = stream;
  $('previa').onloadedmetadata = () => quadro($('previa').videoWidth / $('previa').videoHeight);  // câmera não 16:9
  stream.getTracks().forEach(t => t.addEventListener('ended', () => {  // desconectou (o stop() não chama isto)
    motivoParada = motivoParada || `${t.kind === 'audio' ? 'o microfone' : 'a câmera'} desligou`;
  }));
  rec = new MediaRecorder(stream, {mimeType: TIPOS.find(t => MediaRecorder.isTypeSupported(t)),
                                   videoBitsPerSecond: 6e6, audioBitsPerSecond: 128e3});
  rec.onerror = e => {
    motivoParada = 'erro no gravador do navegador: ' + ((e.error && (e.error.message || e.error.name)) || 'sem detalhe');
  };
  rec.ondataavailable = e => {
    const pedaco = e.data;
    if (pedaco.size) fila = fila.then(() => falhou || postar('/pedaco', pedaco).catch(err => {
      falhou = err;
      erro('A gravação parou de chegar no humanim: ' + err.message);
    }));
  };
  rec.onstart = () => contar(3);
  rec.onstop = salvar;
  estado = 'pronto';
  aviso('Espaço para começar');
  medidor();
}

// Barra verde com o nível do microfone; silêncio absoluto por 2 s = microfone no mudo.
function medidor() {
  const ctx = new AudioContext(), an = ctx.createAnalyser(), buf = new Float32Array(1024);
  an.fftSize = buf.length;
  ctx.createMediaStreamSource(stream).connect(an);
  addEventListener('keydown', () => ctx.resume(), {once: true});
  let ultimoSom = performance.now();
  (function passo() {
    an.getFloatTimeDomainData(buf);
    const nivel = Math.sqrt(buf.reduce((s, x) => s + x * x, 0) / buf.length);
    $('nivel').style.width = `${Math.min(100, nivel * 500)}%`;
    if (nivel > 0 || ctx.state !== 'running') ultimoSom = performance.now();
    $('mudo').style.display = performance.now() - ultimoSom > 2000 ? 'block' : 'none';
    if (estado !== 'fim' && estado !== 'erro') requestAnimationFrame(passo);
  })();
}

function contar(n) {
  if (estado !== 'contando') return;
  if (n === 0) {
    de[0] = agora();
    estado = 'gravando';
    document.body.className = 'gravando';
    aviso('');
    marcar();
    return;
  }
  aviso(String(n), 'contagem');
  setTimeout(() => contar(n - 1), t0 + (4 - n) * 1000 - performance.now());
}

async function espaco() {
  if (estado === 'pronto') {
    estado = 'contando';
    aviso('3', 'contagem');
    try { await postar('/inicio'); } catch (e) { return erro('O humanim não respondeu: ' + e.message, false); }
    // O zero do relógio é o start(), não o evento 'start': ele chega uns 120 ms depois, e o vídeo gravado
    // começa no start(). Zerando no evento, todo tempo do tempos.json saía 0,12 s antes da fala no arquivo.
    if (estado === 'contando') { t0 = performance.now(); rec.start(1000); }
  } else if (estado === 'gravando') {
    const t = agora();
    if (t - de[atual] < 0.4) return;  // toque duplo sem querer
    ate[atual] = t;
    if (atual + 1 === falas.length) { marcar(); return encerrar(); }
    atual++;
    de[atual] = t;
    mostrar();
    marcar();
  }
}

function regravar() {
  if (estado !== 'gravando') return;
  de[atual] = agora();
  regravadas.add(falas[atual].linha);
  marcar();
  document.body.classList.add('regravou');
  clearTimeout(regravar.t);
  regravar.t = setTimeout(() => document.body.classList.remove('regravou'), 900);
}

function parar() {
  if (['preparando', 'pronto', 'contando'].includes(estado)) {
    if (rec && rec.state !== 'inactive') { rec.onstop = rec.ondataavailable = null; rec.stop(); }
    fim('Cancelado. Nada foi gravado.');
    estado = 'cancelado';
    postar('/cancelar').catch(() => {});
  } else if (estado === 'gravando') {
    const t = agora();
    if (t - de[atual] < 1 && atual > 0) atual--;  // tinha acabado de passar: essa linha nem começou
    else ate[atual] = t;
    marcar();
    encerrar();
  }
}

function encerrar() {
  estado = 'salvando';
  document.body.className = 'fim';
  aviso('Salvando…');
  rec.stop();
}

async function salvar() {
  desligar();
  let parou = '';
  if (estado === 'contando' || estado === 'gravando') {  // o navegador parou a gravação sozinho
    parou = motivoParada || 'a câmera ou o microfone parou de mandar imagem e som';
    if (estado === 'contando') atual = -1;  // nenhuma linha começou
    else if (agora() - de[atual] < 1 && atual > 0) atual--;  // tinha acabado de passar: essa linha nem começou
    else ate[atual] = agora();
    estado = 'salvando';
    document.body.className = 'fim';
    aviso('A gravação parou sozinha (' + parou + '). Salvando o que foi gravado…');
  }
  const tempos = lista();
  try {
    await fila;
    if (falhou) return;
    await postar('/fim', JSON.stringify({tempos, regravadas: [...regravadas], parou}));
    fim(`Salvo: ${tempos.length} de ${falas.length} linhas. Pode fechar esta janela.`);
    setTimeout(() => window.close(), 1500);
  } catch (e) { erro((parou ? '' : 'Não consegui salvar: ') + e.message, false); }
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); espaco(); }
  else if (e.code === 'KeyR') regravar();
  else if (e.code === 'Escape') parar();
});

addEventListener('beforeunload', e => {
  if (['contando', 'gravando', 'salvando'].includes(estado)) { e.preventDefault(); e.returnValue = ''; }
});

addEventListener('pagehide', () => {
  if (!['fim', 'erro', 'cancelado'].includes(estado)) navigator.sendBeacon('/fechou');
});

preparar();
</script>
</body>
</html>
